<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <meta name="theme-color" content="#174a7e">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="stylesheet" href="{{ '/assets/css/course.css' | relative_url }}">
    <script src="{{ '/assets/js/course.js' | relative_url }}" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    <main id="main-content" class="site-shell" tabindex="-1">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>C++ Programming · Fall 2026</span>
      <a href="#main-content">Back to top ↑</a>
    </footer>
  </body>
</html>
